<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor NFC</title>
    <style>
        /* 'white-space: pre-wrap' força o HTML a respeitar todas as quebras de linha */
        #output {
            white-space: pre-wrap;
            font-family: monospace;
            background-color: #f4f4f4;
            padding: 16px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <h1>Leitura de NFC</h1>
    <button id="startButton">Iniciar Leitura NFC</button>
    
    <!-- Mudamos de <p> para <pre> para preservar a formatação de texto puro -->
    <pre id="output"></pre>

    <script>
        const startButton = document.getElementById('startButton');
        const output = document.getElementById('output');

        startButton.addEventListener('click', async () => {
            if ('NDEFReader' in window) {
                try {
                    const ndef = new NDEFReader();
                    await ndef.scan();
                    output.textContent = 'Aguardando leitura da tag NFC...';

                    ndef.onreading = event => {
                        for (const record of event.message.records) {
                            if (record.recordType === "text") {
                                // Decodificação padrão NDEF (remove o código do idioma do início)
                                const textDecoder = new TextDecoder(record.encoding || "utf-8");
                                const data = new Uint8Array(record.data.buffer);
                                const langCodeLength = data[0] & 0x3F;
                                const textoLimpo = textDecoder.decode(data.subarray(1 + langCodeLength));

                                output.textContent = textoLimpo;
                            } else {
                                const decoder = new TextDecoder();
                                output.textContent = decoder.decode(record.data);
                            }
                        }
                    };
                } catch (error) {
                    output.textContent = `Erro: ${error}`;
                }
            } else {
                output.textContent = 'NFC não suportado neste navegador.';
            }
        });
    </script>
</body>
</html>
