<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor NFC</title>
    <style>
        /* A propriedade pre-wrap preserva as quebras de linha (\n) do texto lido */
        #output {
            white-space: pre-wrap;
            font-family: monospace; /* Opcional: deixa o texto alinhado estilo bloco de notas */
            background-color: #f4f4f4;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>Leitura de NFC</h1>
    <button id="startButton">Iniciar Leitura NFC</button>
    <p id="output"></p>

    <script>
        const startButton = document.getElementById('startButton');
        const output = document.getElementById('output');

        startButton.addEventListener('click', async () => {
            if ('NDEFReader' in window) {
                try {
                    const ndef = new NDEFReader();
                    await ndef.scan();
                    output.textContent = 'Aguardando leitura da tag NFC...';

                    ndef.onreading = event => {
                        const decoder = new TextDecoder();
                        for (const record of event.message.records) {
                            // 1. Decodifica o texto e salva na variável 'texto'
                            const texto = decoder.decode(record.data);
                            
                            // 2. Exibe o texto completo no elemento (o CSS fará a quebra de linha)
                            output.textContent = `Dados lidos:\n${texto}`;
                        }
                    };
                } catch (error) {
                    output.textContent = `Erro: ${error}`;
                }
            } else {
                output.textContent = 'NFC não suportado neste navegador.';
            }
        });
    </script>
</body>
</html>
