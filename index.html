<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor NFC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #FEFEFE;
            color: #1a1a1a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            gap: 40px;
        }

        .nfc-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .nfc-container.hidden {
            display: none;
        }

        .sonar-ring {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 1px solid #004D52;
            opacity: 0;
            animation: sonar 3s ease-out infinite;
        }

        .sonar-ring:nth-child(2) { animation-delay: 1s; }
        .sonar-ring:nth-child(3) { animation-delay: 2s; }

        @keyframes sonar {
            0% {
                width: 100px;
                height: 100px;
                opacity: 0.5;
            }
            100% {
                width: 220px;
                height: 220px;
                opacity: 0;
            }
        }

        .circle {
            position: absolute;
            border-radius: 50%;
        }

        .circle.c3 {
            width: 100px;
            height: 100px;
            border: 2px solid #004D52;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 77, 82, 0.06);
            padding: 10px;
        }

        .circle.c3 span {
            color: #004D52;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-align: center;
            line-height: 1.3;
        }

        .label {
            color: #6b6b6b;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .label.visible {
            opacity: 1;
        }

        .label.success {
            color: #2e7d32;
        }

        /* Card de resultado da leitura */
        .result-card {
            display: none;
            position: relative;
            width: 100%;
            max-width: 380px;
            background: linear-gradient(180deg, #ffffff 0%, #f7f9fa 100%);
            border: 1px solid #e2e2e2;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .result-card.visible {
            display: block;
        }

        .corner-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #cdd7d8;
        }

        .corner-dot.tl { top: 10px; left: 10px; }
        .corner-dot.tr { top: 10px; right: 10px; }
        .corner-dot.bl { bottom: 10px; left: 10px; }
        .corner-dot.br { bottom: 10px; right: 10px; }

        .result-card .card-id {
            color: #004D52;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .result-card pre {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: monospace;
            color: #1a1a1a;
            font-size: 14px;
            line-height: 1.5;
            margin-top: 12px;
        }

        .result-card .data-rows {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
        }

        .result-card .data-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 9px 0;
            border-bottom: 1px solid #ececec;
        }

        .result-card .data-row:last-child {
            border-bottom: none;
        }

        .result-card .data-row .data-label {
            color: #6b6b6b;
            font-size: 12px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .result-card .data-row .data-value {
            color: #1a1a1a;
            font-size: 14px;
            font-weight: 600;
            text-align: right;
            word-break: break-word;
        }

        #resetButton {
            display: none;
            background: transparent;
            border: 1px solid #004D52;
            color: #004D52;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        #resetButton.visible {
            display: inline-block;
        }

        #resetButton:hover {
            background: #004D52;
            color: #ffffff;
        }

        /* Botão para abrir o formulário de gravação */
        #openFormButton {
            background: transparent;
            border: 1px solid #004D52;
            color: #004D52;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        #openFormButton:hover {
            background: #004D52;
            color: #ffffff;
        }

        /* Modal do formulário de gravação */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 380px;
            max-height: 90vh;
            overflow-y: auto;
            background: #ffffff;
            border: 1px solid #e2e2e2;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h2 {
            color: #1a1a1a;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }

        #closeFormButton {
            background: transparent;
            border: none;
            color: #6b6b6b;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            padding: 0 4px;
        }

        #closeFormButton:hover {
            color: #1a1a1a;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.hidden {
            display: none;
        }

        .form-group label {
            color: #6b6b6b;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            background: #fafafa;
            border: 1px solid #dadada;
            border-radius: 6px;
            padding: 10px 12px;
            color: #1a1a1a;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #004D52;
        }

        .form-group input[type="date"] {
            color-scheme: light;
        }

        #writeButton {
            background: #004D52;
            border: none;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        #writeButton:hover {
            background: #00666d;
        }

        #writeButton:disabled {
            background: #c2c2c2;
            cursor: not-allowed;
        }

        .write-status {
            font-size: 13px;
            text-align: center;
            min-height: 18px;
        }

        .write-status.pending {
            color: #004D52;
        }

        .write-status.success {
            color: #2e7d32;
        }

        .write-status.error {
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="nfc-container" id="nfcTrigger">
        <div class="sonar-ring"></div>
        <div class="sonar-ring"></div>
        <div class="sonar-ring"></div>
        <div class="circle c3"><span>Clique aqui para iniciar a leitura</span></div>
    </div>

    <div class="label" id="label">Aproxime o celular da tag</div>

    <div class="result-card" id="resultCard">
        <div class="corner-dot tl"></div>
        <div class="corner-dot tr"></div>
        <div class="corner-dot bl"></div>
        <div class="corner-dot br"></div>
        <div class="card-id" id="cardId">IDENTIFICAÇÃO DE ATIVOS JMENDES</div>
        <div class="data-rows" id="dataRows"></div>
        <pre id="output"></pre>
    </div>

    <button id="resetButton">Ler novamente</button>

    <button id="openFormButton">Gravar novo ativo</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2>Gravar dados na tag</h2>
                <button id="closeFormButton">&times;</button>
            </div>

            <div class="form-group">
                <label for="inputTipoAtivo">Tipo do Ativo</label>
                <select id="inputTipoAtivo">
                    <option value="Notebook">Notebook</option>
                    <option value="Impressora">Impressora</option>
                </select>
            </div>

            <div class="form-group" id="groupUsuario">
                <label for="inputUsuario">Usuário</label>
                <input type="text" id="inputUsuario" placeholder="Ex: joao.silva">
            </div>

            <div class="form-group" id="groupMaquina">
                <label for="inputMaquina">Nome da máquina</label>
                <input type="text" id="inputMaquina" placeholder="Ex: Compressor Industrial CI-500">
            </div>

            <div class="form-group">
                <label for="inputModelo">Modelo</label>
                <input type="text" id="inputModelo" placeholder="Ex: CI-500X">
            </div>

            <div class="form-group">
                <label for="inputLocal">Local</label>
                <input type="text" id="inputLocal" placeholder="Ex: Setor de Utilidades - Linha 3">
            </div>

            <div class="form-group">
                <label for="inputServiceTag">Service Tag</label>
                <input type="text" id="inputServiceTag" placeholder="Ex: AX-2201-04">
            </div>

            <div class="form-group" id="groupIp">
                <label for="inputIp">Endereço IP</label>
                <input type="text" id="inputIp" placeholder="Ex: 192.168.0.10">
            </div>

            <div class="form-group" id="groupGarantia">
                <label for="inputGarantia">Garantia</label>
                <input type="date" id="inputGarantia">
            </div>

            <div class="form-group">
                <label for="inputUltimaManutencao">Última Manutenção</label>
                <input type="date" id="inputUltimaManutencao">
            </div>

            <div class="form-group">
                <label for="inputTecnico">Técnico Responsável</label>
                <input type="text" id="inputTecnico" placeholder="Ex: Carlos Mendes">
            </div>

            <div class="form-group">
                <label for="inputServico">Serviço</label>
                <input type="text" id="inputServico" placeholder="Ex: Troca de filtro">
            </div>

            <button id="writeButton">Gravar Tag NFC</button>
            <div class="write-status" id="writeStatus"></div>
        </div>
    </div>

    <script>
        const nfcTrigger = document.getElementById('nfcTrigger');
        const output = document.getElementById('output');
        const dataRows = document.getElementById('dataRows');
        const label = document.getElementById('label');
        const resetButton = document.getElementById('resetButton');
        const resultCard = document.getElementById('resultCard');
        let ndef = null;

        // Rótulos amigáveis para cada campo gravado na tag
        const ROTULOS_CAMPOS = {
            tipoAtivo: 'Tipo do Ativo',
            usuario: 'Usuário',
            nomeMaquina: 'Nome da Máquina',
            modelo: 'Modelo',
            local: 'Local',
            serviceTag: 'Service Tag',
            ip: 'Endereço IP',
            garantia: 'Garantia',
            ultimaManutencao: 'Última Manutenção',
            tecnicoResponsavel: 'Técnico Responsável',
            servico: 'Serviço'
        };

        // Campos cujo valor vem no formato aaaa-mm-dd (input type=date) e devem
        // ser exibidos como dd/mm/aaaa na leitura
        const CAMPOS_DATA = ['garantia', 'ultimaManutencao'];

        function formatarData(valor) {
            const partes = valor.split('-');
            if (partes.length !== 3) return valor;
            const [ano, mes, dia] = partes;
            return `${dia}/${mes}/${ano}`;
        }

        function exibirDadosLidos(textoLido) {
            dataRows.innerHTML = '';
            output.textContent = '';

            try {
                const dados = JSON.parse(textoLido);

                // Monta uma linha para cada campo conhecido que veio preenchido
                Object.keys(ROTULOS_CAMPOS).forEach(chave => {
                    if (dados[chave]) {
                        const valorExibido = CAMPOS_DATA.includes(chave)
                            ? formatarData(dados[chave])
                            : dados[chave];

                        const row = document.createElement('div');
                        row.className = 'data-row';
                        row.innerHTML = `
                            <span class="data-label">${ROTULOS_CAMPOS[chave]}</span>
                            <span class="data-value"></span>
                        `;
                        row.querySelector('.data-value').textContent = valorExibido;
                        dataRows.appendChild(row);
                    }
                });

                // Se o JSON não tinha nenhum dos campos conhecidos, cai no texto puro
                if (!dataRows.children.length) {
                    output.textContent = textoLido;
                }
            } catch (error) {
                // Não é JSON (ex: tag gravada antes dessa versão) — mostra como texto puro
                output.textContent = textoLido;
            }
        }

        async function iniciarLeitura() {
            label.classList.add('visible');

            if ('NDEFReader' in window) {
                try {
                    ndef = new NDEFReader();
                    await ndef.scan();
                    label.textContent = 'Aproxime o celular da tag';
                    ndef.onreading = event => {
                        const decoder = new TextDecoder();
                        for (const record of event.message.records) {
                            exibirDadosLidos(decoder.decode(record.data));
                        }
                        label.textContent = 'Tag lida com sucesso';
                        label.classList.add('success');
                        resetButton.classList.add('visible');
                        resultCard.classList.add('visible');
                        nfcTrigger.classList.add('hidden');
                    };
                } catch (error) {
                    output.textContent = `Erro: ${error}`;
                    resetButton.classList.add('visible');
                    resultCard.classList.add('visible');
                }
            } else {
                output.textContent = 'NFC não suportado neste navegador.';
                resultCard.classList.add('visible');
            }
        }

        function resetarLeitura() {
            output.textContent = '';
            dataRows.innerHTML = '';
            label.textContent = 'Aproxime o celular da tag';
            label.classList.remove('success');
            resetButton.classList.remove('visible');
            resultCard.classList.remove('visible');
            nfcTrigger.classList.remove('hidden');
            // O ndef.scan() já iniciado continua escutando novas tags automaticamente,
            // não é necessário chamar scan() de novo.
        }

        nfcTrigger.addEventListener('click', iniciarLeitura, { once: true });
        resetButton.addEventListener('click', resetarLeitura);

        // --- Controle do modal de gravação ---
        const openFormButton = document.getElementById('openFormButton');
        const closeFormButton = document.getElementById('closeFormButton');
        const modalOverlay = document.getElementById('modalOverlay');

        openFormButton.addEventListener('click', () => {
            modalOverlay.classList.add('visible');
        });

        closeFormButton.addEventListener('click', () => {
            modalOverlay.classList.remove('visible');
        });

        // Fecha o modal ao clicar fora da caixa do formulário
        modalOverlay.addEventListener('click', (event) => {
            if (event.target === modalOverlay) {
                modalOverlay.classList.remove('visible');
            }
        });

        // --- Gravação de dados na tag ---
        const writeButton = document.getElementById('writeButton');
        const writeStatus = document.getElementById('writeStatus');
        const inputTipoAtivo = document.getElementById('inputTipoAtivo');
        const inputUsuario = document.getElementById('inputUsuario');
        const inputMaquina = document.getElementById('inputMaquina');
        const inputModelo = document.getElementById('inputModelo');
        const inputLocal = document.getElementById('inputLocal');
        const inputServiceTag = document.getElementById('inputServiceTag');
        const inputIp = document.getElementById('inputIp');
        const inputGarantia = document.getElementById('inputGarantia');
        const inputUltimaManutencao = document.getElementById('inputUltimaManutencao');
        const inputTecnico = document.getElementById('inputTecnico');
        const inputServico = document.getElementById('inputServico');

        const groupUsuario = document.getElementById('groupUsuario');
        const groupMaquina = document.getElementById('groupMaquina');
        const groupGarantia = document.getElementById('groupGarantia');
        const groupIp = document.getElementById('groupIp');

        // Ajusta quais campos aparecem conforme o Tipo do Ativo escolhido
        function atualizarCamposPorTipo() {
            const isImpressora = inputTipoAtivo.value === 'Impressora';

            groupUsuario.classList.toggle('hidden', isImpressora);
            groupMaquina.classList.toggle('hidden', isImpressora);
            groupGarantia.classList.toggle('hidden', isImpressora);
            groupIp.classList.toggle('hidden', !isImpressora);

            // Limpa o valor dos campos ocultos para não gravar dado desatualizado
            if (isImpressora) {
                inputUsuario.value = '';
                inputMaquina.value = '';
                inputGarantia.value = '';
            } else {
                inputIp.value = '';
            }
        }

        inputTipoAtivo.addEventListener('change', atualizarCamposPorTipo);
        atualizarCamposPorTipo(); // aplica o estado inicial (Notebook) ao carregar

        async function gravarTag() {
            const isImpressora = inputTipoAtivo.value === 'Impressora';

            const dadosAtivo = {
                tipoAtivo: inputTipoAtivo.value,
                usuario: inputUsuario.value.trim(),
                nomeMaquina: inputMaquina.value.trim(),
                modelo: inputModelo.value.trim(),
                local: inputLocal.value.trim(),
                serviceTag: inputServiceTag.value.trim(),
                ip: inputIp.value.trim(),
                garantia: inputGarantia.value.trim(),
                ultimaManutencao: inputUltimaManutencao.value.trim(),
                tecnicoResponsavel: inputTecnico.value.trim(),
                servico: inputServico.value.trim()
            };

            // Só exige preenchimento dos campos que estão visíveis para o tipo escolhido
            const camposObrigatorios = isImpressora
                ? ['tipoAtivo', 'modelo', 'local', 'serviceTag', 'ip', 'ultimaManutencao', 'tecnicoResponsavel', 'servico']
                : ['tipoAtivo', 'usuario', 'nomeMaquina', 'modelo', 'local', 'serviceTag', 'garantia', 'ultimaManutencao', 'tecnicoResponsavel', 'servico'];

            const camposVazios = camposObrigatorios.some(campo => dadosAtivo[campo] === '');
            if (camposVazios) {
                writeStatus.textContent = 'Preencha todos os campos antes de gravar.';
                writeStatus.className = 'write-status error';
                return;
            }

            if (!('NDEFReader' in window)) {
                writeStatus.textContent = 'NFC não suportado neste navegador.';
                writeStatus.className = 'write-status error';
                return;
            }

            // Remove do JSON os campos não aplicáveis ao tipo escolhido (ficam vazios mesmo)
            if (isImpressora) {
                delete dadosAtivo.usuario;
                delete dadosAtivo.nomeMaquina;
                delete dadosAtivo.garantia;
            } else {
                delete dadosAtivo.ip;
            }

            const dados = JSON.stringify(dadosAtivo);

            try {
                writeButton.disabled = true;
                writeStatus.textContent = 'Aproxime a tag NFC para gravar...';
                writeStatus.className = 'write-status pending';

                // Reaproveita a instância existente (criada na leitura) ou cria uma nova
                if (!ndef) {
                    ndef = new NDEFReader();
                }

                await ndef.write({
                    records: [{ recordType: 'text', data: dados }]
                });

                writeStatus.textContent = 'Tag gravada com sucesso!';
                writeStatus.className = 'write-status success';
            } catch (error) {
                writeStatus.textContent = `Erro ao gravar: ${error}`;
                writeStatus.className = 'write-status error';
            } finally {
                writeButton.disabled = false;
            }
        }

        writeButton.addEventListener('click', gravarTag);
    </script>
</body>
</html>
